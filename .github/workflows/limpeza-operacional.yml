name: Limpeza operacional
on:
  workflow_dispatch: {}
  schedule:
    # Domingo, 06:00 UTC = domingo, 03:00 em Brasília (UTC-3).
    - cron: '0 6 * * 0'
permissions: {}
concurrency:
  # O mesmo grupo das sincronizações impede alteração simultânea de public/dados.
  group: sincronizacao-publica
  cancel-in-progress: false
jobs:
  validar:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python scripts/validate_public.py
      - run: python scripts/validate_workflows.py
      - run: python scripts/check_secrets.py
      - run: python scripts/cleanup_operational.py --dry-run
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/js/*.test.mjs
  publicar:
    needs: validar
    if: vars.ENABLE_REAL_SYNC == 'true' && vars.ENABLE_REAL_PUBLISH == 'true'
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python scripts/validate_public.py
      - run: python scripts/cleanup_operational.py --dry-run
      - run: python -m unittest tests.unit.test_cleanup_operational -v
      - run: python scripts/cleanup_operational.py --apply
      - run: python scripts/validate_public.py
      - name: Criar commit somente se mudou
        id: commit
        run: |
          git diff --check
          git diff --stat
          if test -z "$(git status --porcelain -- public private)"; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -u -- public/dados
            git commit -m 'chore: remove orphaned generated data'
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Push do commit desta execução
        if: steps.commit.outputs.created == 'true' && vars.ENABLE_REAL_PUBLISH == 'true'
        env: {COMMIT_SHA: '${{ steps.commit.outputs.sha }}'}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Sincronizar cliente
on:
  workflow_dispatch:
    inputs:
      cliente_id: {description: 'ID lógico do cliente', required: true, type: string}
      confirmar: {description: 'Digite SINCRONIZAR', required: true, type: string}
permissions: {}
concurrency:
  group: sincronizacao-publica
  cancel-in-progress: false
jobs:
  validar:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/js/*.test.mjs
      - run: python scripts/validate_workflows.py
      - name: Validar ID
        env: {CLIENTE_ID: '${{ inputs.cliente_id }}'}
        run: python -c 'import os,re,sys;sys.exit(0 if re.fullmatch(r"[a-z0-9][a-z0-9-]{2,39}",os.environ["CLIENTE_ID"]) else 1)'
  publicar:
    needs: validar
    if: vars.ENABLE_REAL_SYNC == 'true' && inputs.confirmar == 'SINCRONIZAR'
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - env: {CLIENTE_ID: '${{ inputs.cliente_id }}'}
        run: python -m src.publicacao.sync --cliente "$CLIENTE_ID"
      - run: python scripts/validate_public.py
      - name: Criar commit somente se mudou
        id: commit
        run: |
          if test -z "$(git status --porcelain -- public private)"; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add public private/clientes/*/sincronizacao.json private/clientes/*/ultimo-valido.json
            git commit -m "dados: sincroniza cliente ${{ inputs.cliente_id }}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Push do commit desta execução
        if: steps.commit.outputs.created == 'true' && vars.ENABLE_REAL_PUBLISH == 'true'
        env: {COMMIT_SHA: '${{ steps.commit.outputs.sha }}'}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

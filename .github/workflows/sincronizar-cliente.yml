name: Sincronizar cliente
on:
  workflow_dispatch:
    inputs:
      cliente_id: {description: 'ID lógico do cliente', required: true, type: string}
      confirmar: {description: 'Digite SINCRONIZAR', required: true, type: string}
permissions: {contents: read}
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - name: Validar ID
        env: {CLIENTE_ID: '${{ inputs.cliente_id }}'}
        run: python -c 'import os,re,sys;sys.exit(0 if re.fullmatch(r"[a-z0-9][a-z0-9-]{2,39}",os.environ["CLIENTE_ID"]) else 1)'
      - name: Executar ou simular
        env: {CLIENTE_ID: '${{ inputs.cliente_id }}'}
        run: |
          if [ "${{ vars.ENABLE_REAL_SYNC }}" = true ] && [ "${{ inputs.confirmar }}" = SINCRONIZAR ]; then python -m src.publicacao.sync --cliente "$CLIENTE_ID"; else python -m src.publicacao.sync --cliente "$CLIENTE_ID" --dry-run; fi
      - run: python scripts/validate_public.py
      - name: Commit e push protegidos
        if: vars.ENABLE_REAL_SYNC == 'true' && vars.ENABLE_REAL_PUBLISH == 'true' && secrets.SYNC_PUSH_TOKEN != '' && inputs.confirmar == 'SINCRONIZAR'
        env: {TOKEN: '${{ secrets.SYNC_PUSH_TOKEN }}'}
        run: |
          git diff --quiet -- public private || { git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add public private/clientes/*/sincronizacao.json private/clientes/*/ultimo-valido.json; git commit -m "dados: sincroniza cliente ${{ inputs.cliente_id }}"; git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}; }

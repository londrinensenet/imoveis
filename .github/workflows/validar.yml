name: Validar
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_public.py
      - run: python scripts/check_secrets.py
      - name: Proibir marcadores incompletos
        run: '! rg -n "\\b(TODO|FIXME)\\b" --glob "!ARQUITETURA.md" --glob "!AGENTS.md" .'

name: Validar
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/js/*.test.mjs
      - run: python scripts/validate_public.py
      - run: python scripts/check_secrets.py
      - run: python scripts/validate_workflows.py
      - name: Proibir marcadores incompletos
        run: '! rg -n "\\b(TODO|FIXME)\\b" --glob "!ARQUITETURA.md" --glob "!AGENTS.md" .'

name: Sincronizar todos
on:
  schedule:
    - cron: '0 12,15,18,21 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      confirmar: {description: 'Digite SINCRONIZAR para operação real', required: false, type: string}
permissions: {}
concurrency:
  group: sincronizacao-publica
  cancel-in-progress: false
jobs:
  validar:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/js/*.test.mjs
      - run: python scripts/validate_public.py
      - run: python scripts/validate_workflows.py
  horario:
    permissions: {}
    runs-on: ubuntu-latest
    outputs: {executar: '${{ steps.fuso.outputs.executar }}'}
    steps:
      - id: fuso
        env: {EVENTO: '${{ github.event_name }}'}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, os
          from zoneinfo import ZoneInfo
          hora = datetime.datetime.now(ZoneInfo("America/Sao_Paulo")).hour
          print(f"executar={'true' if os.environ['EVENTO'] == 'workflow_dispatch' or hora in {9, 12, 15, 18, 23} else 'false'}")
          PY
  publicar:
    needs: [validar, horario]
    if: needs.horario.outputs.executar == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar autorização da sincronização real
        env:
          ENABLE_REAL_SYNC: '${{ vars.ENABLE_REAL_SYNC }}'
          CONFIRMAR: '${{ inputs.confirmar }}'
          EVENTO: '${{ github.event_name }}'
        run: |
          if test "$ENABLE_REAL_SYNC" != 'true'; then
            echo '::error::Sincronização bloqueada: Repository Variable ENABLE_REAL_SYNC deve ser true.'
            exit 1
          fi
          if test "$EVENTO" = 'workflow_dispatch' && test "$CONFIRMAR" != 'SINCRONIZAR'; then
            echo '::error::Sincronização manual bloqueada: input confirmar inválido.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m src.publicacao.sync
      - run: python scripts/validate_public.py
      - name: Detectar alterações publicáveis
        id: changes
        run: |
          if test -z "$(git status --porcelain -- public private)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhuma alteração encontrada.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Criar commit somente se mudou e a publicação estiver habilitada
        id: commit
        if: steps.changes.outputs.changed == 'true' && vars.ENABLE_REAL_PUBLISH == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public private/clientes/*/sincronizacao.json private/clientes/*/ultimo-valido.json
          git commit -m 'dados: sincroniza imóveis'
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Informar publicação bloqueada
        if: steps.changes.outputs.changed == 'true' && vars.ENABLE_REAL_PUBLISH != 'true'
        run: |
          echo '::error::Processamento executado, mas publicação bloqueada: Repository Variable ENABLE_REAL_PUBLISH deve ser true.'
          exit 1
      - name: Push do commit desta execução
        if: steps.commit.outputs.created == 'true' && vars.ENABLE_REAL_PUBLISH == 'true'
        env: {COMMIT_SHA: '${{ steps.commit.outputs.sha }}'}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Portal Londrinense</title><link rel="stylesheet" href="painel.css"></head>
<body><section id="login" class="login-card"><p class="eyebrow">Portal Londrinense</p><h1>Administração de imóveis</h1><p>Acesse o ambiente privado para gerenciar clientes e feeds.</p><form><label>Usuário<input name="usuario" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="login-status" role="alert"></p></section>
<div id="app" hidden><aside><a class="brand" href="#/">Londrinense <small>Administração</small></a><button id="recolher" class="icon" aria-label="Recolher menu">☰</button><nav aria-label="Administração"><a href="#/" data-route="dashboard">▦ <span>Visão geral</span></a><a href="#/clientes" data-route="clientes">♙ <span>Clientes</span></a><a href="#/feeds" data-route="feeds">⌁ <span>Feeds</span></a><a href="#/diagnostico" data-route="diagnostico">♡ <span>Diagnóstico</span></a><a href="#/conta" data-route="conta">◎ <span>Minha conta</span></a></nav><button id="sair" class="logout">↪ <span>Sair</span></button></aside>
<div class="workspace"><header><button id="menu" class="icon" aria-label="Abrir menu">☰</button><div><small>Administração</small><strong id="crumb">Visão geral</strong></div><label class="global"><span class="sr-only">Pesquisa administrativa</span><input id="global-search" type="search" placeholder="Pesquisar clientes…"></label><button class="icon" aria-label="Notificações">♢</button><div class="account"><span id="user-name">—</span><small id="user-role">—</small></div></header><main id="conteudo" tabindex="-1"></main></div></div>
<dialog id="confirm"><form method="dialog"><h2 id="confirm-title">Confirmar ação</h2><p id="confirm-text"></p><div class="actions"><button value="cancel" class="secondary">Cancelar</button><button value="confirm">Confirmar</button></div></form></dialog><div id="toasts" aria-live="polite"></div>
<script type="module" src="painel.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Painel | Portal Londrinense</title><link rel="stylesheet" href="painel.css"></head><body><main><h1>Painel de imóveis</h1><p id="estado" role="status"></p><section id="login"><form><label>Usuário<input name="usuario" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><section id="acoes" hidden><h2>Operações autorizadas</h2><button id="sync">ATUALIZAR/SINCRONIZAR AGORA</button><form id="cliente"><h3>Dados do cliente</h3><label>ID lógico<input name="id" pattern="[a-z0-9][a-z0-9-]{2,39}" required></label><label>Nome<input name="nome" maxlength="160" required></label><label>Tipo<select name="tipo"><option value="imobiliaria">Imobiliária</option><option value="corretor">Corretor</option></select></label><label>Cidade<input name="cidade" maxlength="80"></label><label>UF<input name="uf" maxlength="2"></label><label>CRECI<input name="creci" maxlength="40"></label><button>Salvar cliente</button></form><form id="feed"><h3>Feed privado</h3><label>ID lógico<input name="cliente_id" pattern="[a-z0-9][a-z0-9-]{2,39}" required></label><label>URL HTTPS do feed<input name="feed_url" type="url" maxlength="2048" required></label><button>Salvar feed</button><button id="sync-cliente" type="button">Sincronizar este cliente</button></form><button id="sair">Sair</button></section></main><script src="painel.js"></script></body></html>
